# Сборка Windows-версии «Копирки»: NSIS-установщик под x64, без подписи кода.
#
# Запускается вручную (Actions → «Сборка Windows» → Run workflow), на теги vX.Y.Z
# и на push в ветку windows-build. На остальные ветки не запускается намеренно:
# репозиторий публичный (с 09.09.2026), минуты Actions на Windows тратятся втрое
# против Linux, и собирать бандл на каждый коммит незачем.
#
# Про ветку windows-build. Кнопка «Run workflow» появляется в интерфейсе только тогда,
# когда файл workflow'а есть в ветке по умолчанию (main) — это правило GitHub, не наше.
# Пока он туда не влит, единственный способ получить сборку — запушить работу в ветку
# windows-build: этот триггер сработает без main. После влития в main достаточно
# «Run workflow» с выбором любой ветки.
#
# Почему в CI, а не на машине Сергея: Windows-бандл нельзя собрать на macOS — нет MSVC,
# нет makensis, и ни один нативный модуль в payload не проверить. Хост здесь и есть цель,
# поэтому кросс-конвейера (как scripts/build-intel.mjs для Intel) не требуется:
# бинарник Node берётся из раннера, prebuild better-sqlite3 под win32-x64 лежит в самом
# пакете, @img/sharp-win32-x64 ставит обычный npm ci.
#
# Тег vX.Y.Z, кроме сборки, публикует установщик в GitHub Release этого тега —
# последним шагом, уже после всех проверок. Зачем: артефакт прогона («Забрать
# установщик» внизу страницы прогона) скачивается только с токеном и только zip'ом,
# а ассет релиза лежит по прямому постоянному адресу и берётся с Мака обычным
# `curl -L -O`. `gh` на машине Сергея не стоит, ставить его ради одного файла
# незачем — отсюда и релиз.
#
# Установщик не подписан. Windows покажет SmartScreen — это объясняется в инструкции
# по установке, а не лечится настройками сборки.
name: Сборка Windows

on:
  workflow_dispatch:
  push:
    branches:
      - windows-build
    tags:
      - 'v*'

# contents: write — только ради шага «Релиз на GitHub» в самом низу: создать релиз
# и залить в него ассет иначе нельзя. Всё остальное в этом workflow'е читает и пишет
# только рабочую копию раннера. Расширение прав безопасно ровно потому, что сам шаг
# стоит под `if: startsWith(github.ref, 'refs/tags/v')`: push в windows-build и ручной
# «Run workflow» релиза не создают и в репозиторий ничего не пишут.
permissions:
  contents: write

# Второй запуск на той же ветке отменяет первый: 25 минут Windows-раннера дороже,
# чем результат заведомо устаревшей сборки.
concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # windows-latest — это Windows Server 2025 с Visual Studio Enterprise 2026 (версия 18.x):
    # GitHub перевёл на неё метки windows-latest и windows-2025 в июне 2026
    # (actions/runner-images#14017). Rust с MSVC 18 работает — rustup и cargo 1.98 лежат
    # на самом образе, а rust-lang/rust ещё в марте 2026 обновил документацию под VS 2026
    # (rust-lang/rust#154104); известных поломок cc/link.exe на этой версии нет.
    #
    # Запасной вариант: если cargo или tauri build споткнутся именно о MSVC — в логе это
    # будет «linker `link.exe` not found», «could not find any Visual Studio installation»
    # или ошибка сборки крейта с cc/windows-rs — заменить на `runs-on: windows-2022`.
    # Там VS 2022 (17.x), она заведомо совместима, и метка живёт без объявленной даты
    # снятия. Node и npm ставит setup-node, так что от образа зависит только MSVC.
    # Обратно на windows-latest — когда поломка исправится в апстриме.
    runs-on: windows-latest
    # Холодная сборка Tauri на Windows — это полтысячи крейтов дважды (debug под тесты
    # и release под бандл). С прогретым кэшем минут пятнадцать, без него около часа.
    # 120, а не 90: первый прогон идёт с пустым кэшем cargo, «около часа» — оценка снизу,
    # и обрыв по таймауту стоит дороже лишнего запаса. Он не тратит минуты сам по себе
    # (лимит только режет), зато при обрыве теряется ещё и сохранение кэша target'а,
    # то есть следующий прогон снова окажется холодным.
    timeout-minutes: 120

    env:
      # Инкрементальная сборка в CI бесполезна (каждый прогон с чистого листа),
      # а кэш target'а раздувает вдвое.
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1

    defaults:
      run:
        # bash на windows-latest — это Git Bash. Он и без Cyrillic-сюрпризов, и одинаков
        # с локальными командами из README; pipefail в нём включён по умолчанию.
        shell: bash

    steps:
      # Мажорные версии actions'ов: v4 у всех четырёх работала на Node 20, который GitHub
      # объявил устаревшим и принудительно переводит на Node 24 — в логе прогона №1 это
      # висело предупреждением на каждом шаге. Взяты актуальные мажоры (сентябрь 2026):
      # checkout v7, setup-node v7, cache v6, upload-artifact v7. Все они уже на Node 24,
      # и ни один параметр, который мы здесь используем, в этих мажорах не менялся —
      # переходы v4→v7 сводились к смене рантайма и переезду на ESM.
      - name: Забрать код
        uses: actions/checkout@v7

      # Ровно та мажорная версия, под которую собраны нативные модули payload'а:
      # bundle-server.mjs откажется работать с любой другой.
      - name: Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - name: Версии инструментов
        run: |
          node --version
          npm --version
          rustc --version
          cargo --version
          rustup target add x86_64-pc-windows-msvc
          # MSVC печатаем отдельно и заранее. Rust ищет link.exe через vswhere, и если
          # на образе он лежит не там или без нужного компонента — узнать об этом лучше
          # сейчас за две секунды, чем через двадцать минут на линковке крейта.
          vswhere='/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe'
          if [ -x "$vswhere" ]; then
            "$vswhere" -latest -products '*' \
              -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 \
              -property installationVersion || true
            "$vswhere" -latest -products '*' \
              -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 \
              -property installationPath || true
          else
            echo "::warning::vswhere не найден — cargo может не найти MSVC; см. запасной вариант windows-2022 в шапке workflow'а"
          fi

      # ── Зависимости ──────────────────────────────────────────────────────────
      #
      # --ignore-scripts обязателен, и вот почему. У better-sqlite3 нет ни install,
      # ни preinstall, ни postinstall — но в пакете лежит binding.gyp, и npm в таком
      # случае сам подставляет `node-gyp rebuild`. На прогоне №1 это и убило сборку:
      # на образе Visual Studio 18 (2026), а node-gyp 11.5 знает версии только до 17
      # и отвечает `find VS unknown version "undefined"` (nodejs/node-gyp#3214, #3282).
      #
      # Собирать better-sqlite3 из исходников нам и не нужно. В самом пакете лежат
      # готовые бинарники на восемь платформ (prebuilds/win32-x64.node в том числе),
      # и загрузчик lib/binding.js пробует prebuilds ПЕРВЫМ, а build/Release — только
      # если prebuild'а нет. Больше того: binding.gyp пакета сам объявляет цели как
      # 'type': 'none', когда prebuild для хоста найден, — то есть штатный
      # `node-gyp rebuild` здесь и задуман пустышкой, просто до неё дело не доходит,
      # падая ещё на configure. Ровно этот prebuild bundle-server.mjs и кладёт
      # в payload (trimBetterSqlite), так что установка без сборки — не обход,
      # а тот же результат более коротким путём.
      #
      # Что ещё в дереве зависит от install-скриптов:
      #   esbuild (postinstall: node install.js) — на Windows скрипт почти ничего
      #     не делает: подмена bin/esbuild нативным бинарником у него под
      #     `if (os.platform() !== 'win32')`, остаётся только проверка версии.
      #     Бинарник и без скрипта берётся из @esbuild/win32-x64 в рантайме
      #     (lib/main.js → generateBinPath), чем и живут vite и tsx.
      #   fsevents — только darwin, на Windows не ставится вовсе.
      # У sharp и @tauri-apps/cli lifecycle-скриптов нет ни одного: их нативные части
      # приезжают платформенными optionalDependencies (@img/sharp-win32-x64,
      # @tauri-apps/cli-win32-x64-msvc), и они есть в обоих package-lock.json.
      #
      # Локальные команды на macOS это не меняет: флаг стоит здесь, а не в .npmrc.
      - name: Зависимости (npm ci)
        run: npm ci --no-audit --no-fund --ignore-scripts

      # Отдельным шагом и до сборки: @tauri-apps/cli — это 20 секунд, и если
      # платформенный бинарник не приедет, узнать об этом надо здесь, а не после
      # четверти часа cargo. Раньше это делал сам build-windows.mjs, из-за чего провал
      # установки выглядел в логе как провал сборки установщика. npm ci, а не npm install:
      # в CI нужна ровно та версия CLI, что в desktop/package-lock.json.
      - name: Зависимости оболочки (npm ci в desktop)
        run: npm ci --no-audit --no-fund --ignore-scripts
        working-directory: desktop

      # Пять секунд, которые экономят прогон. Установка без install-скриптов обязана
      # оставить рабочими три нативных модуля, и проверить это лучше сразу: иначе
      # отсутствующий платформенный пакет всплывёт либо на сборке web (esbuild),
      # либо на payload (sharp), либо вообще у человека на машине (better-sqlite3).
      - name: Проверка нативных модулей
        run: |
          cat > check-native.cjs <<'EOF'
          const fs = require('node:fs');
          const path = require('node:path');
          const target = `${process.platform}-${process.arch}`;

          async function main() {
            const root = path.dirname(require.resolve('better-sqlite3/package.json'));
            const prebuild = path.join(root, 'prebuilds', `${target}.node`);
            if (!fs.existsSync(prebuild)) {
              throw new Error(`better-sqlite3: нет prebuilds/${target}.node — в payload положить нечего`);
            }
            const db = new (require('better-sqlite3'))(':memory:');
            db.exec('CREATE TABLE t(a)');
            db.prepare('INSERT INTO t VALUES (?)').run(1);
            if (db.prepare('SELECT a FROM t').get().a !== 1) throw new Error('better-sqlite3: запрос вернул не то');
            db.close();
            console.log(`  better-sqlite3: prebuilds/${target}.node — открывает базу`);

            const sharp = require('sharp');
            const png = await sharp({ create: { width: 4, height: 4, channels: 3, background: '#000' } })
              .png()
              .toBuffer();
            if (png.length === 0) throw new Error('sharp: пустой PNG');
            console.log(`  sharp ${sharp.versions.sharp}: libvips ${sharp.versions.vips} — жмёт картинку`);

            const esbuild = require('esbuild');
            const out = esbuild.transformSync('export const a: number = 1', { loader: 'ts' });
            if (!out.code.includes('a = 1')) throw new Error('esbuild: transformSync вернул не то');
            console.log(`  esbuild ${esbuild.version}: бинарник отвечает`);
          }

          main().catch((error) => {
            process.stderr.write(`${error.message}\n`);
            process.exit(1);
          });
          EOF
          node check-native.cjs
          rm -f check-native.cjs

      # Собранный web/dist нужен ещё до cargo: generate_context! вшивает статику
      # в бинарник. Сборка обоих воркспейсов заодно и есть typecheck — web делает
      # `tsc -b && vite build`, server `tsc -p`, так что ошибка типов валит этот шаг.
      - name: Интерфейс и сервер (typecheck + сборка)
        run: npm run build

      # Отдельным шагом, а не только внутри tauri build: на первой Windows-сборке
      # важно видеть в логе, что в payload лёг node.exe нужной дуги и платформенный sharp.
      - name: Payload сервера
        run: npm run app:payload

      # Реестр и git-кэш cargo экономят несколько минут на выкачивании крейтов,
      # target.noindex — основное время сборки (у Tauri в дереве около пятисот крейтов).
      # Ключ по Cargo.lock, restore-keys подхватывает предыдущий: cargo сам пересоберёт
      # то, что изменилось. Кэш target'а тяжёлый, порядка гигабайта-двух: если он начнёт
      # выедать лимит репозитория или обваливаться на загрузке — убрать эту строку,
      # сборка станет дольше, но не сломается.
      #
      # Шаг стоит после npm, а не до: восстановление гигабайтного кэша — это минуты,
      # и тратить их, чтобы потом упасть на установке зависимостей, незачем.
      - name: Кэш cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            desktop/src-tauri/target.noindex
          key: windows-cargo-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            windows-cargo-

      - name: Юнит-тесты оболочки (cargo test)
        id: cargo-test
        continue-on-error: true
        working-directory: desktop/src-tauri
        run: cargo test --target x86_64-pc-windows-msvc

      # Самая ценная проверка Windows: smoke реально поднимает сервер по HTTP.
      # Не блокирует сборку намеренно — сервер писался под macOS (пути к конфигу,
      # запуск tsx), и до его портирования установщик всё равно нужен для ручной
      # проверки оболочки. Красным итог всё равно станет — см. последний шаг.
      - name: Дымовой прогон сервера (smoke)
        id: smoke
        continue-on-error: true
        run: npm run smoke --workspace=server

      # --skip-install: devDependencies оболочки уже стоят отдельным шагом выше.
      # Именно так этот флаг и задуман в build-windows.mjs («в CI это отдельный шаг»).
      - name: Установщик NSIS
        run: npm run app:build:windows -- --skip-install 2>&1 | tee build-windows.log

      - name: Что уехало в payload
        if: always()
        run: |
          {
            echo "# payload (desktop/src-tauri/resources/backend)"
            du -sh desktop/src-tauri/resources/backend || true
            find desktop/src-tauri/resources/backend -maxdepth 1 -mindepth 1 | sort || true
            echo
            echo "# нативные модули"
            find desktop/src-tauri/resources/backend -name '*.node' -o -name '*.dll' | sort || true
          } > payload-listing.txt
          cat payload-listing.txt

      - name: Забрать установщик
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: kopirka-windows-x64-installer
          path: desktop/src-tauri/target.noindex/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

      # ── Проверка собранного приложения ───────────────────────────────────────
      #
      # Всё, что выше, проверяет дерево сборки: cargo test — оболочку без бандла,
      # smoke — сервер, запущенный через tsx из рабочей копии. Установщика и payload'а
      # в том виде, в каком они приедут человеку, не видит ни одна из этих проверок.
      # А проверить надо: у владельца только Mac, участника с Windows под рукой нет,
      # и раннер здесь — единственная настоящая Windows в конвейере.
      #
      # Скрипт ставит собранный установщик молча (ключ `/S` — штатный ключ NSIS; ставится
      # в `%LOCALAPPDATA%\Копирка`, потому что в tauri.windows.conf.json задан
      # installMode: currentUser — `StrCpy $INSTDIR "$LOCALAPPDATA\${PRODUCTNAME}"`
      # в шаблоне tauri-bundler), выводит дерево установки, запускает приложение,
      # ждёт ответа его сервера на /api/health по порту из %APPDATA%\Kopirka\config.json
      # и гоняет через живой HTTP импорт картинки и выдачу превью — то есть проверяет
      # sharp и better-sqlite3 именно из установленного payload'а.
      #
      # Шаг стоит ПОСЛЕ выгрузки установщика: его провал не должен лишать нас файла
      # для ручной установки. По той же причине continue-on-error — красным итог сделает
      # последний шаг, разобравшись, что именно провалилось.
      #
      # Про окно и раннер. GUI-приложение на windows-раннере запускается: с июня 2023 года
      # служба раннера держит интерактивный сеанс рабочего стола (actions/runner-images#7227),
      # а WebView2 приезжает на образ вместе с Edge (actions/runner-images#9538) — версию
      # рантайма скрипт печатает из реестра. Но чёрный кадр на CI ничего не доказывает
      # про живую машину, поэтому отрисовка окна и снимок экрана в скрипте помечены как
      # справочные: провалить прогон может только установка, health или операции по HTTP.
      # Тост-уведомления на раннере не проверить вовсе — их некому увидеть; проверяем
      # только ярлык в «Пуске», без которого у приложения нет AUMID, а значит и тостов.
      - name: Дымовой прогон установленного приложения
        id: installed
        continue-on-error: true
        timeout-minutes: 20
        run: node desktop/scripts/smoke-installed-windows.mjs 2>&1 | tee installed-smoke.log

      # Первый в истории проекта взгляд на окно «Копирки» под Windows. Отдельным
      # артефактом, а не внутри логов: за ним будут лазить руками.
      - name: Забрать снимок экрана
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kopirka-windows-x64-screenshot
          path: installed-smoke/installed-screen.png
          if-no-files-found: warn
          retention-days: 14

      - name: Забрать логи
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kopirka-windows-x64-logs
          path: |
            build-windows.log
            payload-listing.txt
            installed-smoke.log
            installed-smoke/**
          if-no-files-found: warn
          retention-days: 14

      # Итог: установщик уже загружен, но провал smoke или cargo test не должен
      # выглядеть зелёной галочкой.
      - name: Итог проверок
        if: always()
        run: |
          echo "cargo test: ${{ steps.cargo-test.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "smoke: ${{ steps.smoke.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "установленное приложение: ${{ steps.installed.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          failed=0
          if [ "${{ steps.cargo-test.outcome }}" != "success" ]; then
            echo "::error::cargo test не прошёл"
            failed=1
          fi
          if [ "${{ steps.smoke.outcome }}" != "success" ]; then
            echo "::error::smoke не прошёл — сервер на Windows ещё не поднимается"
            failed=1
          fi
          # Пустой outcome — шаг не выполнялся (сборка упала раньше): это уже отражено
          # провалом своего шага, вторым сообщением об ошибке шуметь не нужно.
          if [ -n "${{ steps.installed.outcome }}" ] && [ "${{ steps.installed.outcome }}" != "success" ]; then
            echo "::error::установленное приложение не прошло дымовой прогон — подробности в kopirka-windows-x64-logs/installed-smoke.log"
            failed=1
          fi
          exit $failed

      # ── Публикация ───────────────────────────────────────────────────────────
      #
      # Последним шагом и без `if: always()` — намеренно: «Итог проверок» выше валит
      # прогон, если провалились cargo test, smoke или дымовой прогон установленного
      # приложения, а упавший шаг отменяет все следующие. То есть сломанный установщик
      # до релиза не доезжает, хотя артефактом его забрать по-прежнему можно.
      #
      # Имя файла здесь не задаётся: build-windows.mjs переименовывает то, что собрал
      # Tauri, в ASCII (`Kopirka_<версия>_x64-setup.exe`) и сам гарантирует, что в
      # каталоге nsis остался ровно один .exe — он же чистит каталог до сборки, чтобы
      # установщик из кэша target'а не притворился свежим. Поэтому ищем единственный
      # .exe, а версию не подставляем: тег и tauri.conf.json обязаны совпадать, но
      # проверять это здесь — лишний повод развалить релиз на ровном месте.
      #
      # gh release view/upload вместо просто create: прогон по тегу можно перезапустить
      # (и релиз под этот тег уже будет существовать), а ронять публикацию из-за этого
      # незачем — --clobber перезаливает ассет поверх.
      - name: Релиз на GitHub (только для тега)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          nsis=desktop/src-tauri/target.noindex/x86_64-pc-windows-msvc/release/bundle/nsis
          exe="$(find "$nsis" -maxdepth 1 -type f -name '*.exe')"
          if [ -z "$exe" ] || [ "$(printf '%s\n' "$exe" | wc -l)" -ne 1 ]; then
            echo "::error::в $nsis ожидался ровно один .exe, а найдено: ${exe:-ничего}"
            exit 1
          fi
          echo "Установщик: $exe"

          notes='Установщик Windows x64 (без подписи, SmartScreen — см. инструкцию). Сборки macOS и архивы с инструкцией — https://kopirka.instat.pro/. Что изменилось — CHANGELOG.md'

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Релиз $GITHUB_REF_NAME уже есть — перезаливаем установщик"
            gh release upload --clobber "$GITHUB_REF_NAME" "$exe"
          else
            echo "Создаём релиз $GITHUB_REF_NAME"
            gh release create "$GITHUB_REF_NAME" "$exe" \
              --title "Копирка ${GITHUB_REF_NAME#v}" \
              --notes "$notes"
          fi
