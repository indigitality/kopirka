      </span>
      <button
        id="open-options"
        class="btn-icon"
        type="button"
        title="Настройки расширения"
        aria-label="Настройки расширения"
      >
        <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.4">
          <circle cx="8" cy="8" r="2.4" />
          <path
            d="M8 1.6v1.5M8 12.9v1.5M14.4 8h-1.5M3.1 8H1.6M12.5 3.5l-1.1 1.1M4.6 11.4l-1.1 1.1M12.5 12.5l-1.1-1.1M4.6 4.6L3.5 3.5"
            stroke-linecap="round"
          />
        </svg>
      </button>
    </header>

    <main id="views" class="views">
      <!-- Состояние: проверка связи при открытии -->
      <section class="view view--center" data-view="checking" hidden>
        <div class="spinner" aria-hidden="true"></div>
        <p class="view__text">Проверяем связь с Копиркой…</p>
      </section>

      <!-- Состояние: исходное — D30 с правками Сергея от 11.09 -->
      <section class="view" data-view="idle" hidden>
        <p class="status">
          <span class="status__dot" aria-hidden="true"></span>
          <span class="status__text">Сервер подключён</span>
          <span id="status-port" class="status__port text-technical"></span>
        </p>
        <div class="stack">
          <button id="capture-visible" class="btn btn--primary btn--block btn--tall" type="button">
            <svg class="btn__icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4">
              <rect x="1.6" y="2.6" width="12.8" height="9" rx="1.6" />
              <path d="M5.2 14h5.6" stroke-linecap="round" />
            </svg>
            Снять скриншот видимой области
          </button>
          <button id="capture-area" class="btn btn--secondary btn--block btn--tall" type="button">
            <svg class="btn__icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4">
              <path d="M4.3 1.3v10.4h10.4" stroke-linecap="round" stroke-linejoin="round" />
              <path d="M1.3 4.3h10.4v10.4" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            Снять область
          </button>
        </div>

        <!-- FDB-03 — «Сохранять в»: D30 (покой) и D31 (список раскрыт) -->
        <div class="folder">
          <span class="label-section" id="folder-label">Сохранять в</span>
          <div class="folder__anchor">
            <button
              id="folder-trigger"
              class="select"
              type="button"
              aria-haspopup="listbox"
              aria-expanded="false"
              aria-labelledby="folder-label folder-name"
            >
              <!-- Иконку рисует popup.js: лоток у «Не разобрано», папка у папки. -->
              <span id="folder-icon" class="select__slot" aria-hidden="true"></span>
              <span id="folder-name" class="select__name">Не разобрано</span>
              <svg class="select__chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.57" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="m6 9 6 6 6-6" />
              </svg>
            </button>
            <div id="folder-list" class="picker" role="listbox" aria-label="Папка для сохранения" hidden>
              <div id="folder-options" class="picker__options"></div>
              <div id="folder-filter-row" class="picker__filter" hidden>
                <svg class="picker__search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" aria-hidden="true">
                  <circle cx="11" cy="11" r="8" />
                  <path d="m21 21-4.3-4.3" />
                </svg>
                <input
                  id="folder-filter"
                  class="picker__input"
                  type="text"
                  placeholder="Фильтр по имени папки"
                  autocomplete="off"
                  spellcheck="false"
                />
              </div>
            </div>
          </div>
          <p class="view__hint">
            Правый клик по картинке на странице — «Сохранить в Копирку».
          </p>
        </div>
      </section>

      <!-- Состояние: выбор области на странице (popup закрывается сразу после) -->
      <section class="view view--center" data-view="selecting" hidden>
        <div class="spinner" aria-hidden="true"></div>
        <p class="view__text">Выделите область на странице</p>
        <p class="view__hint">Esc — отмена</p>
      </section>

      <!-- Состояния: предпросмотр и отправка -->
      <section class="view" data-view="preview" hidden>
        <div class="preview">
          <img id="preview-image" class="preview__image" alt="Снятый кадр" />
          <div id="preview-busy" class="preview__busy" hidden>
            <div class="spinner" aria-hidden="true"></div>
          </div>
        </div>
        <p id="preview-caption" class="text-technical preview__caption"></p>
        <div class="row">
          <button id="save" class="btn btn--primary row__grow" type="button">Сохранить</button>
          <button id="retake" class="btn btn--secondary" type="button">Переснять</button>
        </div>
      </section>

      <!-- Состояние: успех -->
      <section class="view view--center" data-view="success" hidden>
        <span class="check" aria-hidden="true">
          <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M3.2 8.4l3.3 3.3 6.3-7" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </span>
        <p id="success-text" class="view__text"></p>
      </section>

      <!-- Состояние: сервер недоступен -->
      <section class="view" data-view="server_down" hidden>
        <div class="notice">
          <p class="notice__title">Копирка не запущена</p>
          <p class="notice__text">Откройте приложение «Копирка» и повторите.</p>
          <p id="server-address" class="text-technical notice__address"></p>
        </div>
        <div class="row">
          <button id="retry-health" class="btn btn--primary row__grow" type="button">Повторить</button>
          <button id="open-options-2" class="btn btn--secondary" type="button">Адрес</button>
        </div>
      </section>

      <!-- Состояние: ошибка сохранения -->
      <section class="view" data-view="save_error" hidden>
        <div class="notice">
          <p class="notice__title">Не удалось сохранить</p>
          <p id="error-text" class="notice__text"></p>
        </div>
        <div class="row">
          <button id="retry-save" class="btn btn--primary row__grow" type="button">Повторить</button>
          <button id="error-retake" class="btn btn--secondary" type="button">Переснять</button>
        </div>
      </section>
    </main>

    <script type="module" src="popup.js"></script>
  </body>
</html>
